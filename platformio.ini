; PlatformIO project for the ESP32 Desert Race Logging & Vehicle
; Communication Device. See ARCHITECTURE.md for the full design.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Uncomment and set these to your board's serial port if PlatformIO
; doesn't auto-detect it correctly (e.g. multiple USB-serial devices
; plugged in at once). Windows: check Device Manager -> Ports (COM & LPT)
; for the "CH340"/"CP210x"/"USB-SERIAL" entry, e.g. COM5.
; macOS/Linux: usually /dev/cu.usbserial-XXXX or /dev/ttyUSB0.
; upload_port = COM5
; monitor_port = COM5
build_flags =
    -D CORE_DEBUG_LEVEL=3
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SH110X@^2.1.11
    adafruit/Adafruit BusIO@^1.16.1
    mikalhart/TinyGPSPlus@^1.0.3
