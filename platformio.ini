; PlatformIO project for the ESP32 Desert Race Logging & Vehicle
; Communication Device. See ARCHITECTURE.md for the full design.

; Two firmwares share this project so that the LoRa wire format cannot
; drift between them: a change to the packet layout breaks both builds at
; once rather than producing a silent mismatch in the field.
;
;   pio run -e esp32dev    -t upload   ; the vehicle device
;   pio run -e checkpoint  -t upload   ; a checkpoint station
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Uncomment and set these to your board's serial port if PlatformIO
; doesn't auto-detect it correctly (e.g. multiple USB-serial devices
; plugged in at once). Windows: check Device Manager -> Ports (COM & LPT)
; for the "CH340"/"CP210x"/"USB-SERIAL" entry, e.g. COM5.
; macOS/Linux: usually /dev/cu.usbserial-XXXX or /dev/ttyUSB0.
; upload_port = COM5
; monitor_port = COM5
build_flags =
    -D CORE_DEBUG_LEVEL=3
; The vehicle build excludes the station's main().
build_src_filter = +<*> -<station/>
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SH110X@^2.1.11
    adafruit/Adafruit BusIO@^1.16.1
    mikalhart/TinyGPSPlus@^1.0.3
    sandeepmistry/LoRa@^0.8.0

; Checkpoint station: a LoRa receiver that acknowledges crossings and logs
; them to SD. No GNSS, no display, no race logic - see src/station/main.cpp.
[env:checkpoint]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=3
; Only the station's own main() plus the modules it genuinely shares.
build_src_filter =
    +<station/>
    +<LoRaTransport.cpp>
    +<ConfigManager.cpp>
    +<DebugLog.cpp>
lib_deps =
    sandeepmistry/LoRa@^0.8.0
